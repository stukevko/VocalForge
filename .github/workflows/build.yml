name: Build VocalForge

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64 -DVF_COPY_PLUGIN=OFF
      - name: Build
        run: cmake --build build --config Release --target VocalForge_VST3 VocalForge_Standalone --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse build/VocalForge_artefacts/Release/VST3/VocalForge.vst3 out/
          Copy-Item build/VocalForge_artefacts/Release/Standalone/VocalForge.exe out/
          Copy-Item README.md out/
      - uses: actions/upload-artifact@v4
        with:
          name: VocalForge-Windows
          path: out

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G Xcode -DVF_COPY_PLUGIN=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build --config Release --target VocalForge_VST3 VocalForge_AU VocalForge_Standalone -- -quiet
      - name: Package
        run: |
          mkdir -p out
          cp -R build/VocalForge_artefacts/Release/VST3/VocalForge.vst3 out/
          cp -R build/VocalForge_artefacts/Release/AU/VocalForge.component out/
          cp -R build/VocalForge_artefacts/Release/Standalone/VocalForge.app out/
          cp README.md out/
          cd out && zip -qry ../VocalForge-macOS.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: VocalForge-macOS
          path: VocalForge-macOS.zip
